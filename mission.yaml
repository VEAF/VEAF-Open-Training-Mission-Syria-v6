pipeline:
  weather: true                 # toutes les variantes de src/versions.yaml (serveur)
# pipeline:
#   presets: true                 # src/presets.yaml
#   waypoints: true               # src/waypoints.yaml
#   spawnable_aircrafts: true     # src/spawnables.yaml
#   dynamic_slot_templates: true  # src/dynamic-slot-templates.yaml
#   warehouses: true              # src/warehouses.yaml (Dynamic-Slot warehouses)
#   spawn_data: true              # always on; src/spawn-groups.yaml extends the spawn DB
#   weather: true                 # src/versions.yaml

# ── Profils de build ─────────────────────────────────────────────────────────
# Par défaut = serveur VEAF : sécurité active, logs info, toutes les variantes météo.
# `veaf-tools build --profile LOCAL_TEST` : test local rapide.
profiles:
  LOCAL_TEST:
    global_log_level: debug
    security:
      disabled: true
    mission:
      hide_names_from_spawned_groups: false
    pipeline:
      weather: false
cap_missions:
  - group_name: CAP-Idlib-MiG29
    menu_name: CAP rouge MiG-29 (Fox 1) — Idlib — FL220
    briefing: "Deux MiG-29S armés de R-27R et R-60M patrouillent au-dessus d'Idlib, entre Saraqib et la vallée de l'Oronte, au FL220. Emport : R-60M*4,R-27R*2."
  - group_name: CAP-Homs-Su30
    menu_name: CAP rouge Su-30 (Fox 3) — Homs — FL250
    briefing: 'Deux Su-30 armés de R-77 patrouillent au-dessus de Homs, au FL250. Emport : R-73*4,R-77*6.'
  - group_name: CAP-Palmyra-MiG31
    menu_name: CAP rouge MiG-31 (intercepteur haut et rapide) — Palmyre — FL400
    briefing: 'Deux MiG-31 patrouillent haut et vite au-dessus du désert de Palmyre, au FL400. Emport : R-40T*2,R-33*4.'
  - group_name: CAP-Daraa-Su24
    menu_name: Raid rouge Su-24 à intercepter — Daraa — FL120
    briefing: 'Deux Su-24M chargés de bombes tournent au nord de Daraa, au FL120, prêts à frapper le front sud : les intercepter. Emport : FAB-500*4,R-60M*2.'
  - group_name: CAP-Hatay-F16
    menu_name: CAP bleue F-16 (Fox 3) — Hatay — FL220
    briefing: 'Deux F-16C turcs patrouillent au nord de la frontière, entre Hatay et Gaziantep, au FL220. Emport : AIM-120C*4, AIM-9M*2, Fuel.'
  - group_name: CAP-Golan-F15
    menu_name: CAP bleue F-15 (Fox 3) — Golan — FL250
    briefing: "Deux F-15C israéliens patrouillent à l'ouest du Golan, au FL250. Emport : AIM-9*4,AIM-120*4,Fuel*3."

# ── Missions scénarisées (escorte / interception) ─────────────────────────────
combat_missions:
- name: Escorte-Tanf
  friendly_name: Escorte — ravitaillement d'At Tanf
  secured: false
  briefing: 'Un C-130 décolle de Jordanie vers l''enclave d''At Tanf avec du ravitaillement. Une paire de MiG-29S venue de Damas l''attend sur la frontière. Escortez-le jusqu''à l''atterrissage.

    Échec si le C-130 est abattu (constaté par vous : la mission ne le vérifie pas).'
  elements:
  - name: Transport
    groups:
    - SC-Escort-Tanf-C130
    scalable: false
  - name: Menace
    groups:
    - SC-Escort-Tanf-MiG29
    scalable: true
- name: Escorte-Safira
  friendly_name: Escorte — raid F-15E sur Al-Safira
  secured: false
  briefing: 'Deux F-15E partent du sud de la Turquie bombarder le complexe d''Al-Safira (zone Z12). Des Su-30 patrouillent sur Alep. Escortez les F-15E jusqu''à la cible et au retour.

    Activez la zone Z12 si vous voulez voir les dépôts détruits.'
  elements:
  - name: Frappe
    groups:
    - SC-Escort-Safira-F15E
    scalable: false
  - name: Menace
    groups:
    - SC-Escort-Safira-Su30
    scalable: true
- name: Interception-Tu22
  friendly_name: Interception — raid de Tu-22M3 sur Incirlik
  secured: false
  briefing: Deux Tu-22M3 escortés de Su-30 partent du centre de la Syrie bombarder Incirlik par le nord d'Alep. Interceptez-les avant le largage.
  elements:
  - name: Bombardiers
    groups:
    - SC-Intercept-Tu22
    scalable: false
  - name: Escorte
    groups:
    - SC-Intercept-Tu22-Escort
    scalable: true
- name: Interception-VIP
  friendly_name: Interception — transport VIP de Damas à Hmeimim
  secured: false
  briefing: 'Un IL-76 transporte une délégation de Damas vers la base russe de Hmeimim, escorté par deux MiG-29S. Interceptez-le avant l''atterrissage : la route passe à l''ouest de Homs, dans la couverture
    des défenses permanentes.'
  elements:
  - name: Transport
    groups:
    - SC-Intercept-VIP-Il76
    scalable: false
  - name: Escorte
    groups:
    - SC-Intercept-VIP-Escort
    scalable: true
