    combat_zones:
      - type: zone
        zone_name: combatZone_Ceyhan_Easy
        friendly_name: H1 Hélico Ceyhan — facile
        radio_group_name: Entraînement hélicoptères
        training: true
        briefing: "Champ de tir hélicoptères à 8 km à l'est du FARP Ceyhan : cibles inertes (blindés et camions immobiles, tir interdit).\nPosition : bullseye 346°/141 nm (N36°59.801' E035°56.746'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 44 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 21 nm."
